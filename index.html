<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Orrery — Generative Music</title>
  <link rel="preload" href="fonts/courier-prime-400.woff2" as="font" type="font/woff2" crossorigin>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.183.2/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.2/examples/jsm/"
    }
  }
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* Courier Prime: Courier redrawn for screens, with the strokes Courier New
       lacks at small sizes. Hosted here (SIL Open Font License, fonts/OFL.txt),
       so every browser shows the same letters; Courier New stands in until it
       loads, at the same widths. */
    @font-face {
      font-family: 'Courier Prime';
      src: url('fonts/courier-prime-400.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    /* ─── Palette ────────────────────────────────────────────────────────────
       Three inks for text. The dimmest, --ink-3, is the floor: about 7:1 on
       the panels, so a label over a bright star still reads. Controls sit on
       --chip over the scene and --panel in the sheets, dark enough that the
       stars behind them don't break up their letters. */
    :root {
      --ink-1: #e4edf6;   /* selected, pressed, playing */
      --ink-2: #b4c5d6;   /* values, and the controls' own text */
      --ink-3: #8a9db0;   /* labels, and controls not selected */
      --line-1: #7f9fbe;  /* the edge of what's hovered or playing */
      --line-sel: #a3bdd6; /* the edge of what's chosen */
      --line-2: #4a5e72;  /* a control's edge */
      --line-3: #243241;  /* dividers */
      --sel: rgba(110, 150, 210, 0.24);
      --chip: rgba(5, 7, 12, 0.74);
      --panel: rgba(5, 7, 12, 0.92);
      /* Text straight on the scene: a dark halo for contrast, then the glow. */
      --halo: 0 1px 2px #000, 0 0 6px #000, 0 0 16px rgba(100, 140, 200, 0.35);
    }
    html {
      overflow: hidden;
    }
    body {
      background: #0a0a0f;
      color: #ccc;
      font-family: 'Courier Prime', 'Courier New', monospace;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    #three-container {
      position: fixed;
      top: 0; left: 0;
      z-index: 0;
    }
    #three-container canvas { display: block; }

    /* Keyboard focus shows everywhere, the sliders and selects included. */
    :focus-visible { outline: 2px solid var(--line-1); outline-offset: 2px; }

    /* ─── Root UI wrapper ──────────────────────────────────────────────────── */
    #ui {
      position: relative;
      z-index: 1;
      text-align: center;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    /* ─── Mode tabs ───────────────────────────────────────────────────────── */
    #mode-tabs {
      pointer-events: all;
      display: flex;
      border: 1px solid var(--line-2);
      background: var(--chip);
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
    }
    .mode-tab {
      background: transparent;
      border: none;
      border-right: 1px solid var(--line-2);
      color: var(--ink-3);
      font-family: inherit;
      font-size: 11px;
      padding: 8px 22px;
      cursor: pointer;
      letter-spacing: 3px;
      text-transform: uppercase;
      transition: color 0.2s, background 0.2s;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .mode-tab:last-child { border-right: none; }
    /* Hover styles only where there is hover: on a touch screen :hover sticks to
       the last thing tapped, so a toggle tapped away from still looked selected. */
    @media (hover: hover) { .mode-tab:hover { color: var(--ink-1); } }
    .mode-tab.active { color: var(--ink-1); background: var(--sel); }

    /* ─── Kaleidoscope toggle ─────────────────────────────────────────────── */
    /* A view setting for both modes, so it sits outside them: level with the
       mode tabs, in the top-left corner, which no layout uses. Narrow screens
       have no room beside the tabs for the word, so they show its icon. */
    #kaleido-btn {
      pointer-events: all;
      position: fixed;
      top: 20px;
      left: calc(20px + env(safe-area-inset-left, 0px));
      z-index: 2;
      background: var(--chip);
      border: 1px solid var(--line-2);
      color: var(--ink-3);
      font-family: inherit;
      font-size: 11px;
      padding: 8px 22px;
      cursor: pointer;
      letter-spacing: 3px;
      transition: color 0.2s, background 0.2s;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    /* Its negative margins keep the icon from heightening the line, so the
       button stays as tall as the tabs beside it. */
    #kaleido-btn svg { display: none; width: 1.6em; height: 1.6em; margin: -0.3em 0; vertical-align: middle; }
    @media (hover: hover) { #kaleido-btn:hover { color: var(--ink-1); } }
    #kaleido-btn.active { color: var(--ink-1); background: var(--sel); }
    @media (max-width: 759px) {
      #kaleido-btn { left: calc(16px + env(safe-area-inset-left, 0px)); padding: 8px 12px; }
      #kaleido-btn svg { display: inline-block; }
      #kaleido-btn .lbl { display: none; }
    }

    /* ─── Infinite mode UI ────────────────────────────────────────────────── */
    /* Full-width and centred with text-align, not translateX(-50%): NEXT
       grows the row's width, and a %-transform on a box whose size is
       animating desyncs on mobile. */
    #infinite-ui {
      position: fixed;
      bottom: calc(32px + env(safe-area-inset-bottom, 0px));
      left: 0;
      right: 0;
      padding: 0 16px;
      text-align: center;
    }
    #infinite-controls {
      display: flex;
      justify-content: center;
      margin-bottom: 12px;
    }
    #start-btn {
      pointer-events: all;
      background: var(--chip);
      border: 1px solid var(--line-2);
      color: var(--ink-2);
      font-family: inherit;
      font-size: clamp(18px, 5vw, 28px);
      padding: clamp(14px, 3.6vw, 20px) clamp(40px, 10vw, 72px);
      cursor: pointer;
      letter-spacing: 4px;
      text-transform: uppercase;
      transition: all 0.3s;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    @media (hover: hover) { #start-btn:hover           { border-color: var(--line-1); color: var(--ink-1); } }
    #start-btn:active          { border-color: var(--ink-2); color: #fff; }
    /* Playing, it steps back for the scene, but stays readable. */
    #start-btn.playing         { color: var(--ink-3); }
    @media (hover: hover) { #start-btn.playing:hover   { border-color: var(--line-1); color: var(--ink-1); } }

    /* Grow out of PLAY's edges while playing; collapsed to nothing (and out
       of the tab order) while stopped. PREV is for songs alone: eras have no
       history to go back through. */
    #next-btn, #prev-btn {
      pointer-events: none;
      background: var(--chip);
      border: 1px solid transparent;
      color: var(--ink-2);
      font-family: inherit;
      font-size: clamp(12px, 3.2vw, 15px);
      letter-spacing: 3px;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      max-width: 0;
      padding: 0;
      margin-left: 0;
      opacity: 0;
      cursor: pointer;
      transition: max-width 0.35s ease, padding 0.35s ease, margin 0.35s ease,
                  opacity 0.25s ease, border-color 0.2s, color 0.2s;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    #next-btn.shown, #prev-btn.shown {
      pointer-events: all;
      max-width: 160px;
      padding: 0 clamp(16px, 4vw, 26px);
      opacity: 1;
      border-color: var(--line-2);
    }
    #next-btn.shown { margin-left: 10px; }
    #prev-btn.shown { margin-right: 10px; }
    @media (hover: hover) { #next-btn.shown:hover, #prev-btn.shown:hover { border-color: var(--line-1); color: var(--ink-1); } }
    #next-btn.shown:active, #prev-btn.shown:active { border-color: #aabece; color: #e0ecf6; }
    /* All three have to fit the narrowest phones. */
    @media (max-width: 380px) {
      #start-btn { padding-left: 22px; padding-right: 22px; }
      #next-btn.shown, #prev-btn.shown { padding: 0 12px; }
      #next-btn.shown { margin-left: 6px; }
      #prev-btn.shown { margin-right: 6px; }
    }

    /* A change on its way to the speakers (see src/pending.js): lit from the
       press, with a bar along the bottom edge that fills until the change is
       heard, then a fade back once it is. */
    #next-btn, #prev-btn, .kind-action, .header-btn, .action-btn { position: relative; }
    #next-btn.pending, #prev-btn.pending, .kind-action.pending, .header-btn.pending, .action-btn.pending {
      color: #e0ecf6;
      border-color: #aabece;
      transition: none;
    }
    .pending::after {
      content: '';
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 2px;
      background: currentColor;
      transform: scaleX(var(--progress, 0));
      transform-origin: left;
    }
    .landed { animation: landed 0.7s ease-out; }
    @keyframes landed {
      from { color: #fff; border-color: #d0e0f0; }
    }

    /* What's playing, under the controls: a title, then the key and tempo,
       where it has got to, and who's playing. Shown once something plays. */
    #state-line {
      width: fit-content;
      max-width: 100%;
      margin: 0 auto;
      padding: 2px 10px;
      font-size: 12px;
      letter-spacing: 0.1em;
      line-height: 1.65;
      color: var(--ink-2);
      text-shadow: var(--halo);
      /* A soft-edged shade behind the lines: a bright star passing behind
         them would otherwise take a word out. */
      background: rgba(3, 4, 9, 0.42);
      box-shadow: 0 0 22px 16px rgba(3, 4, 9, 0.42);
      border-radius: 24px;
      opacity: 0;
      transition: opacity 1.5s;
    }
    #state-line.active { opacity: 1; }
    #state-line .np-title { font-size: 13px; letter-spacing: 0.2em; color: var(--ink-1); }
    #state-line .np-players { color: var(--ink-3); }

    /* The hidden attribute wins over a display set here (.ctrl-row's flex). */
    [hidden] { display: none !important; }

    /* ERAS / SONGS (and Edit mode's LOOP / SONG): a small segmented switch */
    #infinite-kind {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .kind-toggle {
      pointer-events: all;
      display: inline-flex;
      border: 1px solid var(--line-2);
      background: var(--chip);
    }
    .kind-btn, .kind-action {
      pointer-events: all;
      background: transparent;
      border: none;
      color: var(--ink-3);
      font-family: inherit;
      font-size: 11px;
      letter-spacing: 0.14em;
      padding: 7px 14px;
      cursor: pointer;
      text-transform: uppercase;
      transition: color 0.2s, background 0.2s, border-color 0.2s;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .kind-btn + .kind-btn { border-left: 1px solid var(--line-2); }
    @media (hover: hover) { .kind-btn:hover, .kind-action:hover:not(:disabled) { color: var(--ink-1); } }
    .kind-btn.active { color: var(--ink-1); background: var(--sel); }
    .kind-action {
      border: 1px solid var(--line-2);
      background: var(--chip);
    }
    @media (hover: hover) { .kind-action:hover:not(:disabled) { border-color: var(--line-1); } }
    .kind-action.recording { border-color: #8a6a6a; color: #dcbcbc; }
    .kind-action:disabled { opacity: 0.5; cursor: not-allowed; }
    .kind-action.on { color: var(--ink-1); background: var(--sel); border-color: var(--line-sel); }

    /* KEEP · MORE LIKE THIS · EXPORT: what can be done with the song playing */
    #song-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px 10px;
      margin-bottom: 16px;
    }

    /* ─── Library ─────────────────────────────────────────────────────────── */
    /* A sheet in the stack, just above the transport: what's under the
       transport folds away while it's open, so the transport drops to the
       bottom and stays in reach, with nothing behind the sheet showing
       through. Its height is what's left between the mode tabs and the
       transport. */
    #library {
      --transport-h: calc(1.15 * clamp(18px, 5vw, 28px) + 2 * clamp(14px, 3.6vw, 20px) + 2px);
      --ui-bottom: calc(32px + env(safe-area-inset-bottom, 0px));
      pointer-events: all;
      display: flex;
      flex-direction: column;
      margin: 0 auto 12px;
      width: min(520px, 92vw);
      max-height: calc(100dvh - 76px - var(--ui-bottom) - var(--transport-h) - 12px);
      background: var(--panel);
      border: 1px solid var(--line-2);
      text-align: left;
    }
    .library-open #infinite-kind, .library-open #song-actions,
    .library-open #state-line { display: none; }
    .library-open #infinite-controls { margin-bottom: 0; }
    #library-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 12px clamp(14px, 3.5vw, 22px);
      border-bottom: 1px solid var(--line-3);
    }
    #library-foot {
      display: flex;
      justify-content: center;
      padding: 10px clamp(14px, 3.5vw, 22px);
      border-top: 1px solid var(--line-3);
    }
    #library-head .kind-toggle { background: transparent; }
    .library-arrived {
      padding: 14px 0 2px;
      font-size: 11px;
      letter-spacing: 0.12em;
      color: var(--ink-1);
    }
    #library-list {
      overflow-y: auto;
      overscroll-behavior: contain;
      min-height: 96px;
      padding: 0 clamp(14px, 3.5vw, 22px);
    }
    .library-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px 14px;
      padding: 12px 0;
      border-bottom: 1px solid var(--line-3);
    }
    .library-row:last-child { border-bottom: none; }
    .library-about { flex: 1 1 200px; min-width: 0; }
    .library-name {
      font-size: 12px;
      letter-spacing: 0.14em;
      color: var(--ink-2);
    }
    .library-row.current .library-name { color: var(--ink-1); }
    .library-row.current .library-name::after { content: ' · PLAYING'; color: var(--line-1); }
    .library-meta {
      font-size: 11px;
      letter-spacing: 0.04em;
      color: var(--ink-3);
      margin-top: 5px;
    }
    .library-meta span { white-space: nowrap; }
    .library-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .library-actions .header-btn:last-child { min-width: 80px; } /* KEEP, REMOVE and SURE? line up */
    .library-none {
      padding: 32px 0;
      text-align: center;
      font-size: 11px;
      letter-spacing: 0.12em;
      color: var(--ink-3);
    }
    #form-row .kind-toggle, #composer-row .kind-toggle { background: transparent; }
    @media (max-width: 359px) { #song-row .ctrl-label { display: none; } }

    /* ─── Collapsible sections ──────────────────────────────────────────────── */
    /* One rhythm for every section: 16px from the divider to the header's
       buttons (the tallest thing in it), 8px from them to the summary, and
       16px from the summary to the next divider. */
    .collapsible-section {
      border-top: 1px solid var(--line-3);
      padding-top: 12px;
    }
    .collapsible-section:first-child { border-top: none; padding-top: 0; }
    /* The section's name is its toggle (a button, so it can be reached from
       the keyboard), but the whole header opens it; RANDOM and the other
       buttons beside the name do their own thing. */
    .section-header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      column-gap: 10px;
      cursor: pointer;
      padding: 4px 8px;
      margin: 0 -8px 6px;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      transition: background 0.15s;
      border-radius: 2px;
    }
    .section-toggle {
      background: none;
      border: none;
      color: inherit;
      font: inherit;
      text-align: left;
      padding: 4px 0; /* no taller than the buttons beside it, which set the row */
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    @media (hover: hover) { .section-header:hover { background: rgba(100,150,200,0.07); } }
    @media (hover: hover) { .section-header:hover .section-label { color: var(--ink-1); } }
    @media (hover: hover) { .section-header:hover .section-chevron { color: var(--ink-2); border-color: var(--line-1); } }
    .section-label {
      font-size: 12px;
      letter-spacing: 0.2em;
      color: var(--ink-2);
      text-transform: uppercase;
    }
    .section-header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-chevron {
      font-size: 11px;
      color: var(--ink-3);
      border: 1px solid var(--line-2);
      padding: 2px 8px;
      transition: color 0.15s, border-color 0.15s;
      flex-shrink: 0;
    }
    .section-chevron::before { content: '–'; }
    /* One-line readout of the section's settings, shown only while it's
       collapsed, so a section's RANDOM can be used without opening it. */
    .section-summary {
      grid-column: 1 / -1;
      text-align: left;
      font-size: 11px;
      letter-spacing: 0.05em;
      color: var(--ink-3);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-height: 0;
      opacity: 0;
      transition: max-height 0.3s ease, opacity 0.2s, margin 0.3s ease, color 0.6s;
    }
    .collapsible-section.collapsed .section-summary {
      max-height: 18px;
      margin-top: 8px;
      margin-bottom: 6px;
      opacity: 1;
    }
    .collapsible-section.flash .section-summary { color: var(--ink-1); transition: color 0s; }
    .collapsible-section.collapsed .section-chevron::before { content: '+'; }
    /* Folds with grid-template-rows 1fr → 0fr, like the panel body, so it
       opens to the content's own height whatever that is -- a max-height
       cap clips any section that outgrows it. */
    .section-body {
      display: grid;
      grid-template-rows: 1fr;
      opacity: 1;
      transition: grid-template-rows 0.3s ease, opacity 0.2s;
    }
    .section-inner {
      min-height: 0;
      overflow: hidden;
    }
    .collapsible-section.collapsed .section-body {
      grid-template-rows: 0fr;
      opacity: 0;
    }

    /* ─── Section header buttons (random / clear) ───────────────────────────── */
    .header-btn {
      background: transparent;
      border: 1px solid var(--line-2);
      color: var(--ink-3);
      font-family: inherit;
      font-size: 11px;
      padding: 5px 12px;
      cursor: pointer;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      transition: border-color 0.15s, color 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    @media (hover: hover) { .header-btn:hover { border-color: var(--line-1); color: var(--ink-1); } }
    .header-btn:active { border-color: #aabece; color: #e0ecf6; }

    /* ─── Manual panel ────────────────────────────────────────────────────── */
    /* A sheet in three parts: its top bar, the HIDE/SHOW toggle; the
       settings, which scroll, with RANDOMIZE ALL pinned under them; and the
       transport, always in view, so PLAY is never scrolled away. HIDE folds
       the settings to nothing (grid-template-rows 1fr → 0fr) and leaves the
       bar and the transport, as Infinite mode leaves its own.
       Positioned with bottom/left/right + auto margins rather than a
       translate(-50%, -50%): a %-transform on a box whose size is animating
       desyncs on mobile, and bottom-anchoring needs no centring maths for
       short (landscape) viewports either. */
    #manual-ui {
      --pad: clamp(14px, 3.5vw, 24px);
      --bottom: calc(32px + env(safe-area-inset-bottom, 0px));
      --top-clear: 76px; /* below the fixed #mode-tabs */
      --open-w: min(500px, 92vw);
      pointer-events: none;
      display: flex;
      flex-direction: column;
      position: fixed;
      left: 0;
      right: 0;
      bottom: var(--bottom);
      margin: 0 auto;
      width: var(--open-w);
      max-height: calc(100dvh - var(--bottom) - var(--top-clear));
      overflow: hidden;
      background: var(--panel);
      border: 1px solid var(--line-2);
      text-align: left;
      visibility: hidden;
      opacity: 0;
      transform: translateY(16px);
      transition: opacity 0.3s ease, transform 0.3s ease, visibility 0s linear 0.3s;
    }
    #manual-ui.active {
      visibility: visible;
      opacity: 1;
      transform: none;
      pointer-events: all;
      transition: opacity 0.3s ease, transform 0.3s ease, visibility 0s linear 0s;
    }

    #manual-ui-body {
      display: grid;
      grid-template-rows: 1fr;
      flex: 0 1 auto;
      min-height: 0;
      transition: grid-template-rows 0.4s cubic-bezier(0.5, 0, 0.2, 1);
    }
    #manual-ui.collapsed #manual-ui-body { grid-template-rows: 0fr; }

    /* The settings and RANDOMIZE ALL. The settings shrink and scroll when the
       sheet is full; RANDOMIZE ALL stays put under them. */
    #manual-ui-fold {
      min-height: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      opacity: 1;
      transition: opacity 0.25s ease 0.15s;
    }
    #manual-ui.collapsed #manual-ui-fold { opacity: 0; transition: opacity 0.15s ease; }
    #manual-ui-scroll {
      flex: 0 1 auto;
      min-height: 0;
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 12px var(--pad) 0;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
      scrollbar-color: var(--line-2) transparent;
    }
    #manual-ui-scroll::-webkit-scrollbar { width: 3px; }
    #manual-ui-scroll::-webkit-scrollbar-thumb { background: var(--line-2); }
    #randomize-wrap {
      flex: none;
      padding: 16px var(--pad) 0;
      border-top: 1px solid var(--line-3);
    }
    #randomize-all-btn { width: 100%; }
    #manual-footer {
      flex: none;
      padding: 12px var(--pad) 8px;
    }

    /* Short viewports (landscape phones): sit closer to the bottom edge. */
    @media (max-height: 480px) {
      #manual-ui {
        --bottom: calc(12px + env(safe-area-inset-bottom, 0px));
        --top-clear: 64px;
      }
    }

    /* Wide viewports: dock top-right at full height instead, and fold up
       into that corner. Starts below the centred mode tabs unless the
       viewport is wide enough for both side by side (below). */
    @media (min-aspect-ratio: 5/4) and (min-width: 760px) {
      #manual-ui {
        --open-w: min(440px, 46vw);
        --edge: 20px;
        top: var(--top-clear);
        right: calc(var(--edge) + env(safe-area-inset-right, 0px));
        bottom: auto;
        left: auto;
        margin: 0;
        max-height: calc(100dvh - var(--top-clear) - var(--edge));
        transform: translateX(16px);
      }
      #manual-ui.active { transform: none; }
    }
    @media (min-aspect-ratio: 5/4) and (min-width: 760px) and (max-height: 480px) {
      #manual-ui { --edge: 12px; }
    }
    /* Clear of the tabs (which end ~103px right of centre) at 440px wide. */
    @media (min-aspect-ratio: 5/4) and (min-width: 1140px) {
      #manual-ui { --top-clear: 20px; }
    }

    /* control rows */
    .ctrl-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }
    /* One width for every label, wide enough for COMPOSER, so the controls
       line up from section to section. */
    .ctrl-label {
      font-size: 11px;
      letter-spacing: 0.12em;
      color: var(--ink-3);
      min-width: 6.3em;
      text-align: right;
      flex-shrink: 0;
    }
    .ctrl-value {
      font-size: 12px;
      color: var(--ink-2);
      min-width: 4.5ch;
      text-align: right;
      flex-shrink: 0;
    }

    /* ─── Sliders ───────────────────────────────────────────────────────────── */
    #manual-bpm-slider, .feel-slider {
      -webkit-appearance: none;
      appearance: none;
      flex: 1;
      min-width: 0;
      height: 32px;
      background: transparent;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    #manual-bpm-slider { height: 40px; }
    #manual-bpm-slider::-webkit-slider-runnable-track, .feel-slider::-webkit-slider-runnable-track {
      height: 4px;
      border-radius: 2px;
      background: #4a6a80;
    }
    #manual-bpm-slider::-moz-range-track, .feel-slider::-moz-range-track {
      height: 4px;
      border-radius: 2px;
      background: #4a6a80;
    }
    .feel-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #8aafc8;
      cursor: pointer;
      margin-top: -9px;
    }
    .feel-slider::-moz-range-thumb {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #8aafc8;
      cursor: pointer;
      border: none;
    }
    #manual-bpm-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: clamp(26px, 6vw, 34px);
      height: clamp(26px, 6vw, 34px);
      border-radius: 50%;
      background: #8aafc8;
      cursor: pointer;
      margin-top: -13px;
    }
    #manual-bpm-slider::-moz-range-thumb {
      width: clamp(26px, 6vw, 34px);
      height: clamp(26px, 6vw, 34px);
      border-radius: 50%;
      background: #8aafc8;
      cursor: pointer;
      border: none;
    }

    /* ─── Instruments ─────────────────────────────────────────────────────── */
    #voice-groups {
      margin-bottom: 8px;
    }
    /* instrument groups: a heading over its toggles, like the genre groups */
    .inst-group {
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin-bottom: 14px;
    }
    .inst-group:last-child { margin-bottom: 0; }
    .group-label {
      font-size: 11px;
      letter-spacing: 0.14em;
      color: var(--ink-3);
      text-transform: uppercase;
      text-align: left;
    }
    .subtype-row, .inst-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    /* divider between the rhythm section and the instruments */
    .voices-divider {
      border-top: 1px solid var(--line-3);
      margin: 14px 0;
    }

    /* Genres and instruments are both chips, lit when chosen. An instrument
       keeps its checkbox, for the keyboard and screen readers, out of sight. */
    .genre-btn, .inst-toggle {
      background: transparent;
      border: 1px solid var(--line-2);
      color: var(--ink-3);
      font-family: inherit;
      font-size: 11px;
      padding: 6px 10px;
      cursor: pointer;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    @media (hover: hover) { .genre-btn:hover, .inst-toggle:hover { border-color: var(--line-1); color: var(--ink-1); } }
    .genre-btn.active, .inst-toggle:has(input:checked) { border-color: var(--line-sel); color: var(--ink-1); background: var(--sel); }
    .inst-toggle { position: relative; display: inline-flex; align-items: center; }
    .inst-toggle input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }
    .inst-toggle:has(input:focus-visible) { outline: 2px solid var(--line-1); outline-offset: 2px; }

    /* action buttons */
    #manual-actions {
      display: flex;
      gap: 8px;
    }
    .action-btn {
      flex: 1;
      background: transparent;
      border: 1px solid var(--line-2);
      color: var(--ink-2);
      font-family: inherit;
      font-size: 12px;
      padding: 12px 6px;
      cursor: pointer;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      transition: border-color 0.2s, color 0.2s;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    @media (hover: hover) { .action-btn:hover:not(:disabled) { border-color: var(--line-1); color: var(--ink-1); } }
    .action-btn:active:not(:disabled) { border-color: #aabece; color: #e0ecf6; }
    .action-btn.playing { border-color: var(--line-1); color: var(--ink-1); }
    .action-btn.recording { border-color: #8a6a6a; color: #dcbcbc; cursor: default; }
    .action-btn:disabled { opacity: 0.45; cursor: not-allowed; }

    /* genre groups */
    .genre-groups {
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
    }
    .genre-group { display: flex; flex-direction: column; gap: 7px; }
    #genre-hint { margin-bottom: 12px; color: var(--ink-2); line-height: 1.5; }
    .genre-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      flex: 1;
    }

    /* root / scale dropdowns */
    .ctrl-select {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--line-2);
      color: var(--ink-2);
      font-family: inherit;
      font-size: 11px;
      letter-spacing: 1px;
      padding: 6px;
      cursor: pointer;
      min-width: 0;
    }
    .ctrl-select option { background: #0a0a18; color: var(--ink-2); }
    #manual-root  { width: 64px; flex: none; }
    #manual-scale { flex: 1; }
    #manual-room  { flex: 1; }

    /* ─── Export progress ─────────────────────────────────────────────────────── */
    #export-progress-wrap {
      height: 2px;
      background: rgba(100,140,200,0.08);
      margin: 8px 0 6px;
      overflow: hidden;
      opacity: 0;
      transition: opacity 0.4s;
    }
    #export-progress-wrap.active { opacity: 1; }
    #export-progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #3a5a78, #8aafc8);
      transition: width 0.7s linear;
    }

    #manual-status {
      font-size: 11px;
      letter-spacing: 0.1em;
      color: var(--ink-3);
      text-align: center;
      min-height: 1.4em;
      transition: color 0.5s;
    }
    #manual-status.active { color: var(--ink-2); }

    /* The sheet's top bar: HIDE folds the settings away, SHOW brings them
       back. The label crossfades in place. */
    #panel-hide-btn {
      display: grid;
      flex-shrink: 0;
      width: 100%;
      background: rgba(255, 255, 255, 0.025);
      border: none;
      border-bottom: 1px solid var(--line-3);
      color: var(--ink-3);
      font-family: inherit;
      font-size: 11px;
      padding: 11px 0;
      cursor: pointer;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      transition: color 0.15s;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    @media (hover: hover) { #panel-hide-btn:hover { color: var(--ink-1); } }
    #panel-hide-btn > span {
      grid-area: 1 / 1;
      transition: opacity 0.25s ease;
    }
    #panel-hide-btn .lbl-show { opacity: 0; }
    #manual-ui.collapsed #panel-hide-btn { color: var(--ink-2); }
    #manual-ui.collapsed #panel-hide-btn .lbl-hide { opacity: 0; }
    #manual-ui.collapsed #panel-hide-btn .lbl-show { opacity: 1; }

    /* ─── Narrow screens: layout ────────────────────────────────────────────── */
    @media (max-width: 600px) {
      #manual-ui {
        --open-w: calc(100vw - 20px);
        --bottom: calc(14px + env(safe-area-inset-bottom, 0px));
        --pad: 14px;
      }
      #infinite-ui { bottom: calc(24px + env(safe-area-inset-bottom, 0px)); }
      #library { --ui-bottom: calc(24px + env(safe-area-inset-bottom, 0px)); }
      /* On a phone the row's buttons go under its name, as one strip the
         width of the row, rather than bunched at the left. */
      .library-actions { flex: 1 1 100%; display: grid; grid-template-columns: repeat(3, 1fr); }
      .library-actions .header-btn:last-child { min-width: 0; }
      .ctrl-row { gap: 10px; }
    }

    /* ─── Touch screens: bigger targets ───────────────────────────────────────
       By the pointer, not the width: a phone held sideways or a tablet is as
       wide as a laptop and still driven by a finger. */
    @media (pointer: coarse) {
      .mode-tab { font-size: 12px; padding: 12px 18px; letter-spacing: 2px; }
      #kaleido-btn { font-size: 12px; padding: 12px; }
      #kaleido-btn .lbl { letter-spacing: 2px; padding: 0 6px; }

      .ctrl-row { margin-bottom: 18px; }
      .ctrl-label, .group-label { font-size: 12px; letter-spacing: 0.08em; }
      .ctrl-value { font-size: 13px; }
      .section-label { font-size: 13px; letter-spacing: 0.16em; }
      .section-summary { font-size: 11px; }
      .section-header { margin-bottom: 6px; }
      .section-chevron { font-size: 12px; padding: 4px 10px; }

      .header-btn { font-size: 12px; padding: 9px 14px; letter-spacing: 0.08em; }
      .genre-btn, .inst-toggle { font-size: 12px; padding: 10px 12px; letter-spacing: 0.06em; }
      .kind-btn, .kind-action { font-size: 12px; padding: 10px 14px; letter-spacing: 0.1em; }
      #song-actions { gap: 8px; }
      #song-actions .kind-action { padding-left: 11px; padding-right: 11px; letter-spacing: 0.08em; }
      .ctrl-select { font-size: 12px; padding: 8px 6px; }

      /* four to a row, so tighter than on a desktop */
      .action-btn { font-size: 13px; padding: 14px 4px; letter-spacing: 0.08em; }
      #panel-hide-btn { font-size: 12px; padding: 13px 0; }

      /* thumbs that a thumb (the finger kind) can find */
      .feel-slider::-webkit-slider-thumb { width: 30px; height: 30px; margin-top: -13px; }
      .feel-slider::-moz-range-thumb { width: 30px; height: 30px; }
      #manual-bpm-slider::-webkit-slider-thumb { width: 32px; height: 32px; margin-top: -14px; }
      #manual-bpm-slider::-moz-range-thumb { width: 32px; height: 32px; }

      .library-meta { letter-spacing: 0.04em; }
    }

    /* ─── Short screens (phones held sideways) ─────────────────────────────── */
    /* Infinite's stack would otherwise reach the top of the screen: a smaller
       PLAY, tighter rows, and the players' line left out. */
    @media (max-height: 480px) {
      #infinite-ui { bottom: calc(10px + env(safe-area-inset-bottom, 0px)); }
      #infinite-controls { margin-bottom: 8px; }
      #start-btn { font-size: 16px; padding: 10px 40px; }
      #next-btn, #prev-btn { font-size: 12px; }
      #infinite-kind, #song-actions { margin-bottom: 6px; }
      #state-line { line-height: 1.5; }
      #state-line .np-players { display: none; }
      #library { --ui-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); --transport-h: calc(16px * 1.15 + 22px); margin-bottom: 8px; }

      /* The sheet's bars and buttons tighter, so the settings get the height. */
      #panel-hide-btn { padding: 8px 0; }
      #manual-ui-scroll { padding-top: 4px; }
      #randomize-wrap { padding-top: 8px; }
      #manual-footer { padding-top: 8px; padding-bottom: 4px; }
      .action-btn { padding-top: 9px; padding-bottom: 9px; }
      #export-progress-wrap { margin: 5px 0 3px; }
    }
  </style>
</head>
<body>
  <div id="three-container"></div>
  <div id="ui">

    <!-- Mode tabs -->
    <div id="mode-tabs">
      <button class="mode-tab active" data-mode="infinite">INFINITE</button>
      <button class="mode-tab" data-mode="manual">EDIT</button>
    </div>

    <button id="kaleido-btn" aria-pressed="false" aria-label="Kaleidoscope" title="Kaleidoscope (K)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 2 20.66 7v10L12 22l-8.66-5V7ZM12 2v20M20.66 7 3.34 17M20.66 17 3.34 7"/>
      </svg><span class="lbl">KALEIDOSCOPE</span>
    </button>

    <!-- Infinite mode -->
    <div id="infinite-ui">
      <div id="library" role="dialog" aria-label="Library" hidden>
        <div id="library-head">
          <div class="kind-toggle" role="group" aria-label="Which songs">
            <button class="kind-btn library-tab" data-tab="kept">KEPT</button>
            <button class="kind-btn library-tab" data-tab="recent">RECENT</button>
          </div>
          <button id="library-close" class="kind-action">CLOSE</button>
        </div>
        <div id="library-list"></div>
        <div id="library-foot" hidden>
          <button id="library-copy" class="kind-action" title="Copy a link that brings all these songs into another browser">COPY LIBRARY</button>
        </div>
      </div>
      <div id="infinite-controls">
        <button id="prev-btn" tabindex="-1" aria-hidden="true" title="Back to the top of this song, or just after it starts, to the one before">PREV</button>
        <button id="start-btn" title="Play or pause (Space)">PLAY</button>
        <button id="next-btn" tabindex="-1" aria-hidden="true" title="Move on to the next era">NEXT</button>
      </div>
      <div id="infinite-kind">
        <div class="kind-toggle" role="group" aria-label="What Infinite plays">
          <button class="kind-btn" data-kind="eras" title="Everything changes every 38 seconds">ERAS</button>
          <button class="kind-btn" data-kind="songs" title="One song after another: intro, verses and choruses or builds and drops, outro">SONGS</button>
        </div>
        <button id="library-btn" class="kind-action" hidden aria-expanded="false" aria-controls="library" title="The songs you've kept, and the ones you've heard lately">LIBRARY</button>
      </div>
      <div id="song-actions" hidden>
        <button id="keep-btn" class="kind-action" aria-pressed="false">KEEP</button>
        <button id="like-btn" class="kind-action" title="The same hook, with new instruments">MORE LIKE THIS</button>
        <button id="song-export-btn" class="kind-action" title="Save the whole of this song as a WAV">EXPORT</button>
      </div>
      <div id="state-line">
        <div class="np-title"></div>
        <div class="np-meta"></div>
        <div class="np-where"></div>
        <div class="np-players"></div>
      </div>
    </div>

    <!-- Manual mode -->
    <div id="manual-ui">
      <button id="panel-hide-btn" aria-expanded="true" aria-controls="manual-ui-body">
        <span class="lbl-hide">HIDE</span><span class="lbl-show">SHOW</span>
      </button>

      <div id="manual-ui-body">
      <div id="manual-ui-fold">
      <div id="manual-ui-scroll">
      <!-- Genre presets -->
      <div class="collapsible-section collapsed" id="section-genre">
        <div class="section-header">
          <button class="section-toggle" aria-expanded="false" aria-controls="genre-body"><span class="section-label">GENRE</span></button>
          <div class="section-header-right">
            <button class="header-btn" id="genre-random-btn" title="Another genre">RANDOM</button>
            <span class="section-chevron" aria-hidden="true"></span>
          </div>
          <span class="section-summary" id="genre-summary"></span>
        </div>
        <div class="section-body" id="genre-body"><div class="section-inner">
          <div class="group-label" id="genre-hint" hidden>A GENRE KEEPS THIS HOOK. NEW SONG LETS IT GO.</div>
          <div class="ctrl-row" style="margin-bottom:12px">
            <div id="genre-btns" class="genre-groups"></div>
          </div>
        </div></div>
      </div>

      <!-- Feel: key, scale, BPM, sliders -->
      <div class="collapsible-section collapsed" id="section-feel">
        <div class="section-header">
          <button class="section-toggle" aria-expanded="false" aria-controls="feel-body"><span class="section-label">FEEL</span></button>
          <div class="section-header-right">
            <button class="header-btn" id="feel-random-btn" title="A new feel, inside the genre if one is chosen">RANDOM</button>
            <span class="section-chevron" aria-hidden="true"></span>
          </div>
          <span class="section-summary" id="feel-summary"></span>
        </div>
        <div class="section-body" id="feel-body"><div class="section-inner">
          <div class="ctrl-row">
            <span class="ctrl-label">ROOT</span>
            <select id="manual-root" class="ctrl-select" aria-label="Root"></select>
            <span class="ctrl-label" style="min-width:auto;padding:0 2px">SCALE</span>
            <select id="manual-scale" class="ctrl-select" aria-label="Scale"></select>
          </div>
          <div class="ctrl-row" title="Tempo, in beats per minute">
            <span class="ctrl-label">BPM</span>
            <input id="manual-bpm-slider" type="range" min="40" max="180" step="1" value="90" aria-label="BPM">
            <span id="manual-bpm-value" class="ctrl-value">90</span>
          </div>
          <div class="ctrl-row" title="Every instrument up or down an octave">
            <span class="ctrl-label">OCTAVE</span>
            <input type="range" class="feel-slider" id="manual-octave-slider" min="-1" max="1" step="1" value="0" aria-label="Octave">
            <span class="ctrl-value" id="manual-octave-val">0</span>
          </div>
          <div class="ctrl-row" title="How much plays, and how loud">
            <span class="ctrl-label">DENSITY</span>
            <input type="range" class="feel-slider" id="density-slider" min="0" max="1" step="0.01" value="0.60" aria-label="Density">
            <span class="ctrl-value" id="density-val">60%</span>
          </div>
          <div class="ctrl-row" title="Brightness: how far the filters open, and how loud the cymbals are">
            <span class="ctrl-label">TONE</span>
            <input type="range" class="feel-slider" id="bright-slider" min="0" max="1" step="0.01" value="0.50" aria-label="Tone">
            <span class="ctrl-value" id="bright-val">50%</span>
          </div>
          <div class="ctrl-row" title="How much reverb the sustained instruments get">
            <span class="ctrl-label">SPACE</span>
            <input type="range" class="feel-slider" id="space-slider" min="0" max="1" step="0.01" value="0.50" aria-label="Space">
            <span class="ctrl-value" id="space-val">50%</span>
          </div>
          <div class="ctrl-row" title="The reverb's room">
            <span class="ctrl-label">ROOM</span>
            <select id="manual-room" class="ctrl-select" aria-label="Room"></select>
          </div>
          <div class="ctrl-row" title="How closely the tunes keep to the chord's notes: low roams the scale, high stays on the chord">
            <span class="ctrl-label">HARMONY</span>
            <input type="range" class="feel-slider" id="harmony-slider" min="0" max="1" step="0.01" value="0.78" aria-label="Harmony">
            <span class="ctrl-value" id="harmony-val">78%</span>
          </div>
          <div class="ctrl-row" title="Beats per chord: low changes chords quickly, high holds each one long">
            <span class="ctrl-label">CHORD</span>
            <input type="range" class="feel-slider" id="chord-slider" min="2" max="8" step="1" value="4" aria-label="Beats per chord">
            <span class="ctrl-value" id="chord-val">4</span>
          </div>
          <div class="ctrl-row" title="Sidechain: everything but the drums ducks on every beat, the breathing of house and EDM">
            <span class="ctrl-label">PUMP</span>
            <input type="range" class="feel-slider" id="pump-slider" min="0" max="1" step="0.01" value="0" aria-label="Pump">
            <span class="ctrl-value" id="pump-val">0%</span>
          </div>
          <div class="ctrl-row" style="margin-bottom:4px" title="Filter sweep: everything but the drums closes down and opens back up over sixteen bars, the French house filter">
            <span class="ctrl-label">SWEEP</span>
            <input type="range" class="feel-slider" id="sweep-slider" min="0" max="1" step="0.01" value="0" aria-label="Sweep">
            <span class="ctrl-value" id="sweep-val">0%</span>
          </div>
        </div></div>
      </div>

      <!-- Instruments -->
      <div class="collapsible-section collapsed" id="section-instruments">
        <div class="section-header">
          <button class="section-toggle" aria-expanded="false" aria-controls="instruments-body"><span class="section-label">INSTRUMENTS</span></button>
          <div class="section-header-right">
            <button class="header-btn" id="instruments-random-btn" title="A new kit, from the genre if one is chosen">RANDOM</button>
            <button class="header-btn" id="clear-instruments-btn" title="Turn every instrument off">CLEAR</button>
            <span class="section-chevron" aria-hidden="true"></span>
          </div>
          <span class="section-summary" id="instruments-summary"></span>
        </div>
        <div class="section-body" id="instruments-body"><div class="section-inner">
          <div id="voice-groups"></div>
        </div></div>
      </div>

      <!-- Song: form, composer, length -->
      <div class="collapsible-section collapsed" id="section-song">
        <div class="section-header">
          <button class="section-toggle" aria-expanded="false" aria-controls="song-body"><span class="section-label">SONG</span></button>
          <div class="section-header-right">
            <button class="header-btn" id="new-song-btn" hidden title="Compose a different song from the same settings">NEW SONG</button>
            <span class="section-chevron" aria-hidden="true"></span>
          </div>
          <span class="section-summary" id="song-summary"></span>
        </div>
        <div class="section-body" id="song-body"><div class="section-inner">
          <div class="ctrl-row" id="form-row">
            <span class="ctrl-label">FORM</span>
            <div class="kind-toggle" role="group" aria-label="Form">
              <button class="kind-btn form-btn" data-form="loop" title="The arrangement as it is, round and round">LOOP</button>
              <button class="kind-btn form-btn" data-form="song" title="A song made from it: intro, sections, outro">SONG</button>
            </div>
          </div>

          <div class="ctrl-row" id="song-row" hidden>
            <span class="ctrl-label"></span>
            <button class="kind-action" id="manual-like-btn" title="The same hook, with new instruments. After this, a genre keeps the hook and changes everything else">MORE LIKE THIS</button>
            <button class="kind-action" id="manual-keep-btn" aria-pressed="false">KEEP</button>
          </div>

          <div class="ctrl-row" id="composer-row">
            <span class="ctrl-label">COMPOSER</span>
            <div class="kind-toggle" role="group" aria-label="Composer">
              <button class="kind-btn composer-btn" data-composer="1" title="The first composer: every link made before LATEST plays in it, note for note">ORIGINAL</button>
              <button class="kind-btn composer-btn" data-composer="new" title="The newest composer: writes chords in the genre's language and gives every song a hook">LATEST</button>
            </div>
          </div>

          <div class="ctrl-row" id="length-row" style="margin-bottom:4px">
            <span class="ctrl-label">LENGTH</span>
            <input type="range" class="feel-slider" id="manual-length" min="5" max="300" step="5" value="10" title="How long a loop exports for, or how long a song is" aria-label="Length">
            <span class="ctrl-value" id="manual-length-value">10s</span>
          </div>
        </div></div>
      </div>
      </div>

      <div id="randomize-wrap">
        <button class="action-btn" id="randomize-all-btn" title="A new genre, feel and instruments: in SONG form, a new song">RANDOMIZE ALL</button>
      </div>
      </div>
      </div>

      <div id="manual-footer">
        <div id="manual-actions">
          <button class="action-btn" id="manual-play-btn" disabled title="Play or pause (Space)">PLAY</button>
          <button class="action-btn" id="manual-stop-btn" disabled title="Back to the top">STOP</button>
          <button class="action-btn" id="manual-export-btn" disabled title="Save it as a WAV">EXPORT</button>
          <button class="action-btn" id="manual-share-btn" title="Copy a link to these settings">SHARE</button>
        </div>
        <div id="export-progress-wrap"><div id="export-progress-bar"></div></div>
        <div id="manual-status"></div>
      </div>
    </div>

  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
