<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Orrery — Generative Music</title>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.183.2/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.2/examples/jsm/"
    }
  }
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html {
      overflow: hidden;
    }
    body {
      background: #0a0a0f;
      color: #ccc;
      font-family: 'Courier New', monospace;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    #three-container {
      position: fixed;
      top: 0; left: 0;
      z-index: 0;
    }
    #three-container canvas { display: block; }

    /* ─── Root UI wrapper ──────────────────────────────────────────────────── */
    #ui {
      position: relative;
      z-index: 1;
      text-align: center;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    /* ─── Mode tabs ───────────────────────────────────────────────────────── */
    #mode-tabs {
      pointer-events: all;
      display: flex;
      border: 1px solid #4a5a6a;
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
    }
    .mode-tab {
      background: transparent;
      border: none;
      border-right: 1px solid #4a5a6a;
      color: #7a8a9a;
      font-family: inherit;
      font-size: 11px;
      padding: 8px 22px;
      cursor: pointer;
      letter-spacing: 3px;
      text-transform: uppercase;
      transition: color 0.2s, background 0.2s;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .mode-tab:last-child { border-right: none; }
    .mode-tab:hover { color: #aabece; }
    .mode-tab.active { color: #d0dde8; background: rgba(100,140,200,0.12); }

    /* ─── Infinite mode UI ────────────────────────────────────────────────── */
    /* Full-width and centred with text-align, not translateX(-50%): NEXT
       grows the row's width, and a %-transform on a box whose size is
       animating desyncs on mobile. */
    #infinite-ui {
      position: fixed;
      bottom: calc(36px + env(safe-area-inset-bottom, 0px));
      left: 0;
      right: 0;
      padding: 0 16px;
      text-align: center;
    }
    #infinite-controls {
      display: flex;
      justify-content: center;
      margin-bottom: 12px;
    }
    #start-btn {
      pointer-events: all;
      background: rgba(8, 8, 14, 0.5);
      border: 1px solid #555;
      color: #999;
      font-family: inherit;
      font-size: clamp(18px, 5vw, 28px);
      padding: clamp(16px, 4vw, 22px) clamp(40px, 10vw, 72px);
      cursor: pointer;
      letter-spacing: 4px;
      text-transform: uppercase;
      transition: all 0.3s;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    #start-btn:hover           { border-color: #aaa; color: #eee; }
    #start-btn:active          { border-color: #ccc; color: #fff; }
    #start-btn.playing         { border-color: #556; color: #778; }
    #start-btn.playing:hover   { border-color: #99aacc; color: #bbccdd; }

    /* Grows out of PLAY's right edge while playing; collapsed to nothing
       (and out of the tab order) while stopped. */
    #next-btn {
      pointer-events: none;
      background: rgba(8, 8, 14, 0.5);
      border: 1px solid transparent;
      color: #8899aa;
      font-family: inherit;
      font-size: clamp(12px, 3.2vw, 15px);
      letter-spacing: 3px;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      max-width: 0;
      padding: 0;
      margin-left: 0;
      opacity: 0;
      cursor: pointer;
      transition: max-width 0.35s ease, padding 0.35s ease, margin 0.35s ease,
                  opacity 0.25s ease, border-color 0.2s, color 0.2s;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    #next-btn.shown {
      pointer-events: all;
      max-width: 160px;
      padding: 0 clamp(16px, 4vw, 26px);
      margin-left: 10px;
      opacity: 1;
      border-color: #556;
    }
    #next-btn.shown:hover { border-color: #99aacc; color: #d0dde8; }
    /* Waiting for the next bar line. */
    #next-btn.pending { animation: next-pending 0.6s ease-in-out infinite alternate; }
    @keyframes next-pending {
      from { color: #8899aa; border-color: #556; }
      to   { color: #e0ecf6; border-color: #aabece; }
    }
    #info {
      font-size: 16px;
      letter-spacing: 2px;
      color: #778899;
      line-height: 1.8;
      transition: color 1s;
      text-shadow: 0 1px 4px #000, 0 0 18px rgba(100,140,200,0.6);
    }
    #info.active { color: #ccd8e8; }
    #state-line {
      font-size: 14px;
      color: #556677;
      letter-spacing: 2px;
      transition: color 2s;
      text-shadow: 0 1px 4px #000, 0 0 14px rgba(100,140,200,0.5);
      white-space: pre-line;
      line-height: 1.8;
    }
    #state-line.active { color: #99b0c8; }

    /* ─── Collapsible sections ──────────────────────────────────────────────── */
    .collapsible-section {
      border-top: 1px solid #2a3a4a;
      padding-top: 10px;
    }
    .collapsible-section:first-child { border-top: none; padding-top: 0; }
    .section-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      padding: 4px 6px;
      margin: 0 -6px 6px;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      transition: background 0.15s;
      border-radius: 2px;
    }
    .section-header:hover { background: rgba(100,150,200,0.07); }
    .section-header:hover .section-label { color: #aabece; }
    .section-header:hover .section-chevron { color: #7a9fc0; border-color: #4a6a8a; }
    .section-header .section-label { margin-bottom: 0; }
    .section-header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .section-chevron {
      font-size: 10px;
      color: #4a6a80;
      border: 1px solid #2a3a4a;
      padding: 1px 7px;
      letter-spacing: 1px;
      transition: color 0.15s, border-color 0.15s;
      flex-shrink: 0;
    }
    .section-chevron::before { content: '–'; }
    /* One-line readout of the section's settings, shown only while it's
       collapsed, so a section's RANDOM can be used without opening it. */
    .section-summary {
      flex-basis: 100%;
      text-align: left;
      font-size: 9px;
      letter-spacing: 2px;
      color: #5a7088;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-height: 0;
      opacity: 0;
      transition: max-height 0.3s ease, opacity 0.2s, margin 0.3s ease, color 0.6s;
    }
    .collapsible-section.collapsed .section-summary {
      max-height: 16px;
      margin-top: 6px;
      opacity: 1;
    }
    .collapsible-section.flash .section-summary { color: #d0e0f0; transition: color 0s; }
    .collapsible-section.collapsed .section-chevron::before { content: '+'; }
    /* Folds with grid-template-rows 1fr → 0fr, like the panel body, so it
       opens to the content's own height whatever that is -- a max-height
       cap clips any section that outgrows it. */
    .section-body {
      display: grid;
      grid-template-rows: 1fr;
      opacity: 1;
      transition: grid-template-rows 0.3s ease, opacity 0.2s;
    }
    .section-inner {
      min-height: 0;
      overflow: hidden;
    }
    .collapsible-section.collapsed .section-body {
      grid-template-rows: 0fr;
      opacity: 0;
    }

    /* ─── Section header buttons (random / clear) ───────────────────────────── */
    .header-btn {
      background: transparent;
      border: 1px solid #3a4a5a;
      color: #6a7a8a;
      font-family: inherit;
      font-size: 9px;
      padding: 4px 10px;
      cursor: pointer;
      letter-spacing: 2px;
      text-transform: uppercase;
      transition: border-color 0.15s, color 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .header-btn:hover { border-color: #6a8aaa; color: #aabece; }
    .header-btn:active { border-color: #aabece; color: #e0ecf6; }

    /* ─── Manual panel ────────────────────────────────────────────────────── */
    /* A bottom sheet whose top bar is the HIDE/SHOW toggle. Collapsing
       shrinks the sheet into that bar: the body's height folds to zero
       (grid-template-rows 1fr → 0fr) and the width narrows to a pill, with
       the bottom edge pinned — so the same box that said HIDE ends up as
       the SHOW pill, resting where infinite mode's PLAY sits.
       Positioned with bottom/left/right + auto margins rather than a
       translate(-50%, -50%): a %-transform on a box whose size is animating
       desyncs on mobile, and bottom-anchoring needs no centring maths for
       short (landscape) viewports either. */
    #manual-ui {
      --pad: clamp(14px, 3.5vw, 26px);
      --bottom: calc(36px + env(safe-area-inset-bottom, 0px));
      --top-clear: 76px; /* below the fixed #mode-tabs */
      --open-w: min(500px, 92vw);
      pointer-events: none;
      display: flex;
      flex-direction: column;
      position: fixed;
      left: 0;
      right: 0;
      bottom: var(--bottom);
      margin: 0 auto;
      width: var(--open-w);
      max-height: calc(100dvh - var(--bottom) - var(--top-clear));
      overflow: hidden;
      background: rgba(4, 5, 10, 0.8);
      border: 1px solid #4a5a6a;
      visibility: hidden;
      opacity: 0;
      transform: translateY(16px);
      transition: opacity 0.3s ease, transform 0.3s ease, visibility 0s linear 0.3s,
                  width 0.4s cubic-bezier(0.5, 0, 0.2, 1);
    }
    #manual-ui.active {
      visibility: visible;
      opacity: 1;
      transform: none;
      pointer-events: all;
      transition: opacity 0.3s ease, transform 0.3s ease, visibility 0s linear 0s,
                  width 0.4s cubic-bezier(0.5, 0, 0.2, 1);
    }
    #manual-ui.collapsed { width: 140px; }

    #manual-ui-body {
      display: grid;
      grid-template-rows: 1fr;
      flex: 0 1 auto;
      min-height: 0;
      transition: grid-template-rows 0.4s cubic-bezier(0.5, 0, 0.2, 1);
    }
    #manual-ui.collapsed #manual-ui-body { grid-template-rows: 0fr; }

    /* Keeps its open width while the sheet narrows (centred, clipped by the
       sheet) so the controls don't reflow mid-collapse — they just fade. */
    #manual-ui-scroll {
      min-height: 0;
      width: var(--open-w);
      margin-left: calc((100% - var(--open-w)) / 2);
      overflow-x: hidden;
      overflow-y: auto;
      padding: var(--pad);
      padding-top: 8px;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
      scrollbar-color: #3a4a5a transparent;
      scrollbar-gutter: stable both-edges;
      opacity: 1;
      transition: opacity 0.25s ease 0.15s, padding 0.4s cubic-bezier(0.5, 0, 0.2, 1);
    }
    #manual-ui-scroll::-webkit-scrollbar { width: 3px; }
    #manual-ui-scroll::-webkit-scrollbar-thumb { background: #3a4a5a; }
    /* Padding would hold the folded body open, so it folds too. */
    #manual-ui.collapsed #manual-ui-scroll {
      opacity: 0;
      padding-top: 0;
      padding-bottom: 0;
      transition: opacity 0.15s ease, padding 0.4s cubic-bezier(0.5, 0, 0.2, 1);
    }

    /* Short viewports (landscape phones): sit closer to the bottom edge. */
    @media (max-height: 480px) {
      #manual-ui {
        --bottom: calc(12px + env(safe-area-inset-bottom, 0px));
        --top-clear: 64px;
      }
    }

    /* Wide viewports: dock top-right at full height instead, and fold up
       into a SHOW pill in that corner. Starts below the centred mode tabs
       unless the viewport is wide enough for both side by side (below). */
    @media (min-aspect-ratio: 5/4) and (min-width: 760px) {
      #manual-ui {
        --open-w: min(440px, 46vw);
        --edge: 20px;
        top: var(--top-clear);
        right: calc(var(--edge) + env(safe-area-inset-right, 0px));
        bottom: auto;
        left: auto;
        margin: 0;
        max-height: calc(100dvh - var(--top-clear) - var(--edge));
        transform: translateX(16px);
      }
      #manual-ui.active { transform: none; }
    }
    @media (min-aspect-ratio: 5/4) and (min-width: 760px) and (max-height: 480px) {
      #manual-ui { --edge: 12px; }
    }
    /* Clear of the tabs (which end ~103px right of centre) at 440px wide. */
    @media (min-aspect-ratio: 5/4) and (min-width: 1140px) {
      #manual-ui { --top-clear: 20px; }
    }

    /* control rows */
    .ctrl-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }
    .ctrl-label {
      font-size: 10px;
      letter-spacing: 3px;
      color: #8899aa;
      min-width: 58px;
      text-align: right;
      flex-shrink: 0;
    }
    .ctrl-unit {
      font-size: 10px;
      letter-spacing: 3px;
      color: #8899aa;
      flex-shrink: 0;
    }
    .ctrl-value {
      font-size: 12px;
      color: #aabece;
      min-width: 3ch;
    }

    /* ─── BPM slider ─────────────────────────────────────────────────────────── */
    #manual-bpm-slider {
      -webkit-appearance: none;
      appearance: none;
      flex: 1;
      height: 40px;
      background: transparent;
      outline: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    #manual-bpm-slider::-webkit-slider-runnable-track {
      height: 4px;
      border-radius: 2px;
      background: #4a6a80;
    }
    #manual-bpm-slider::-moz-range-track {
      height: 4px;
      border-radius: 2px;
      background: #4a6a80;
    }
    #manual-bpm-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: clamp(26px, 6vw, 34px);
      height: clamp(26px, 6vw, 34px);
      border-radius: 50%;
      background: #8aafc8;
      cursor: pointer;
      margin-top: -13px;
    }
    #manual-bpm-slider::-moz-range-thumb {
      width: clamp(26px, 6vw, 34px);
      height: clamp(26px, 6vw, 34px);
      border-radius: 50%;
      background: #8aafc8;
      cursor: pointer;
      border: none;
    }


    /* instruments */
    .section-label {
      font-size: 9px;
      letter-spacing: 4px;
      color: #6a7a8a;
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    #voice-groups {
      margin-bottom: 22px;
    }

    /* instrument groups: a heading over its toggles, like the genre groups */
    .inst-group {
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin-bottom: 14px;
    }
    .inst-group:last-child { margin-bottom: 0; }
    .inst-group .group-label { text-align: left; }
    .group-label {
      font-size: 9px;
      letter-spacing: 3px;
      color: #6a7a8a;
      text-transform: uppercase;
      min-width: 46px;
      text-align: right;
      flex-shrink: 0;
    }
    .subtype-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 14px;
    }

    /* divider between groups and grid */
    .voices-divider {
      border-top: 1px solid #2a3040;
      margin: 12px 0;
    }

    /* simple voices grid */
    .inst-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px 6px;
    }

    /* shared toggle style */
    .inst-toggle {
      display: flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .inst-toggle input[type="checkbox"] {
      -webkit-appearance: none;
      appearance: none;
      width: 13px;
      height: 13px;
      border: 1px solid #5a6a7a;
      background: transparent;
      cursor: pointer;
      flex-shrink: 0;
      position: relative;
    }
    .inst-toggle input[type="checkbox"]:checked {
      background: #7a9fc0;
      border-color: #7a9fc0;
    }
    .inst-toggle input[type="checkbox"]:checked::after {
      content: '';
      position: absolute;
      left: 2px;
      top: -1px;
      width: 5px;
      height: 8px;
      border: 2px solid #0a0a0f;
      border-top: none;
      border-left: none;
      transform: rotate(45deg);
    }
    .inst-name {
      font-size: 9px;
      letter-spacing: 2px;
      color: #7a8a9a;
      text-transform: uppercase;
    }
    .inst-toggle input:checked ~ .inst-name { color: #aabece; }

    /* action buttons */
    #manual-actions {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
    }
    .action-btn {
      flex: 1;
      background: transparent;
      border: 1px solid #4a5a6a;
      color: #8899aa;
      font-family: inherit;
      font-size: 11px;
      padding: 11px 8px;
      cursor: pointer;
      letter-spacing: 3px;
      text-transform: uppercase;
      transition: border-color 0.2s, color 0.2s;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .action-btn:hover:not(:disabled) { border-color: #8899aa; color: #d0dde8; }
    .action-btn.playing { border-color: #7a8fa8; color: #aabbc8; }
    .action-btn.recording { border-color: #8a6a6a; color: #c8a8a8; cursor: default; }
    .action-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* genre preset buttons */
    .genre-groups {
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
    }
    .genre-group { display: flex; flex-direction: column; gap: 6px; }
    .genre-group .group-label { text-align: left; }
    .genre-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      flex: 1;
    }
    .genre-btn {
      background: transparent;
      border: 1px solid #3a4a5a;
      color: #6a7a8a;
      font-family: inherit;
      font-size: 9px;
      padding: 5px 11px;
      cursor: pointer;
      letter-spacing: 2px;
      text-transform: uppercase;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .genre-btn:hover { border-color: #6a8aaa; color: #aabece; }
    .genre-btn.active { border-color: #7a9fc0; color: #ccdde8; background: rgba(100,150,200,0.1); }

    /* root / scale dropdowns */
    .ctrl-select {
      background: rgba(255,255,255,0.04);
      border: 1px solid #4a5a6a;
      color: #aabece;
      font-family: inherit;
      font-size: 10px;
      letter-spacing: 1px;
      padding: 5px 6px;
      outline: none;
      cursor: pointer;
    }
    .ctrl-select option { background: #0a0a18; color: #aabece; }
    #manual-root  { width: 56px; }
    #manual-scale { flex: 1; }
    #manual-room  { flex: 1; }

    /* ─── Feel sliders (density / tone / space / length) ────────────────────── */
    .feel-slider {
      -webkit-appearance: none;
      appearance: none;
      flex: 1;
      height: 32px;
      background: transparent;
      outline: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .feel-slider::-webkit-slider-runnable-track {
      height: 4px;
      border-radius: 2px;
      background: #4a6a80;
    }
    .feel-slider::-moz-range-track {
      height: 4px;
      border-radius: 2px;
      background: #4a6a80;
    }
    .feel-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #8aafc8;
      cursor: pointer;
      margin-top: -9px;
    }
    .feel-slider::-moz-range-thumb {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #8aafc8;
      cursor: pointer;
      border: none;
    }

    /* ─── Export progress ─────────────────────────────────────────────────────── */
    #export-progress-wrap {
      height: 2px;
      background: rgba(100,140,200,0.08);
      margin: 6px 0 12px;
      overflow: hidden;
      opacity: 0;
      transition: opacity 0.4s;
    }
    #export-progress-wrap.active { opacity: 1; }
    #export-progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #3a5a78, #8aafc8);
      transition: width 0.7s linear;
    }

    #manual-status {
      font-size: 10px;
      letter-spacing: 2px;
      color: #5a6a7a;
      text-align: center;
      min-height: 14px;
      transition: color 0.5s;
    }
    #manual-status.active { color: #aabece; }

    /* ─── Mobile overrides ──────────────────────────────────────────────────── */
    @media (max-width: 600px) {
      #manual-ui {
        --open-w: calc(100vw - 20px);
        --bottom: calc(16px + env(safe-area-inset-bottom, 0px));
        --pad: 16px;
      }

      #manual-ui-scroll {
        padding-left: 14px;
        padding-right: 14px;
      }

      /* bigger mode tab tap targets */
      .mode-tab {
        font-size: 12px;
        padding: 12px 18px;
        letter-spacing: 2px;
      }

      /* sliders need more room to breathe so thumbs don't overlap */
      .ctrl-row {
        gap: 10px;
        margin-bottom: 22px;
      }

      /* readable labels */
      .ctrl-label  { font-size: 11px; letter-spacing: 1.5px; min-width: 50px; }
      .section-label { font-size: 11px; letter-spacing: 2px; }
      .group-label { font-size: 11px; letter-spacing: 2px; }
      .ctrl-unit   { font-size: 11px; }
      .ctrl-value  { font-size: 13px; min-width: 3.5ch; text-align: right; }

      /* bigger slider thumbs — easier to grab with a thumb (the finger kind) */
      .feel-slider::-webkit-slider-thumb {
        width: 30px;
        height: 30px;
        margin-top: -13px;
      }
      .feel-slider::-moz-range-thumb {
        width: 30px;
        height: 30px;
      }
      #manual-bpm-slider::-webkit-slider-thumb,
      #manual-bpm-slider::-moz-range-thumb {
        width: 32px;
        height: 32px;
      }
      #manual-bpm-slider::-webkit-slider-thumb { margin-top: -14px; }

      /* section headers: bigger tap target */
      .section-header { padding: 8px 6px; margin-bottom: 8px; }
      .section-chevron { font-size: 12px; padding: 2px 9px; }

      /* genre buttons: bigger tap area + font */
      .genre-btn {
        font-size: 11px;
        padding: 9px 14px;
        letter-spacing: 1.5px;
      }

      /* header buttons: bigger tap area */
      .header-btn {
        font-size: 11px;
        padding: 8px 14px;
        letter-spacing: 1.5px;
      }

      /* action buttons */
      .action-btn {
        font-size: 13px;
        padding: 14px 8px;
      }

      /* instrument grid: 2 columns so labels aren't cramped */
      .inst-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 6px 8px;
      }

      /* checkboxes: larger visual + extended tap target via padding */
      .inst-toggle {
        padding: 7px 4px;
        gap: 10px;
      }
      .inst-toggle input[type="checkbox"] {
        width: 18px;
        height: 18px;
        flex-shrink: 0;
      }
      .inst-toggle input[type="checkbox"]:checked::after {
        left: 3px;
        top: 0px;
        width: 7px;
        height: 11px;
      }
      .inst-name {
        font-size: 11px;
        letter-spacing: 1.5px;
      }
    }

    /* The sheet's top bar. Collapsed, it grows into the SHOW pill: its
       divider fades and the label crossfades HIDE → SHOW in place. */
    #panel-hide-btn {
      display: grid;
      flex-shrink: 0;
      width: 100%;
      background: rgba(6, 8, 15, 0.92);
      border: none;
      border-bottom: 1px solid #2a3540;
      color: #6a7a8a;
      font-family: inherit;
      font-size: 10px;
      padding: 12px 0;
      cursor: pointer;
      letter-spacing: 3px;
      text-transform: uppercase;
      transition: color 0.15s, border-color 0.4s ease, font-size 0.4s ease, padding 0.4s ease;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    #panel-hide-btn:hover { color: #d0dde8; }
    #panel-hide-btn > span {
      grid-area: 1 / 1;
      transition: opacity 0.25s ease;
    }
    #panel-hide-btn .lbl-show { opacity: 0; }
    #manual-ui.collapsed #panel-hide-btn {
      font-size: 13px;
      padding: 16px 0;
      border-bottom-color: transparent;
      color: #8899aa;
    }
    #manual-ui.collapsed #panel-hide-btn:hover { color: #d0dde8; }
    #manual-ui.collapsed #panel-hide-btn .lbl-hide { opacity: 0; }
    #manual-ui.collapsed #panel-hide-btn .lbl-show { opacity: 1; }
    #manual-ui.collapsed:hover { border-color: #8899aa; }

    #randomize-all-btn {
      width: 100%;
      margin: 18px 0 18px;
    }
  </style>
</head>
<body>
  <div id="three-container"></div>
  <div id="ui">

    <!-- Mode tabs -->
    <div id="mode-tabs">
      <button class="mode-tab active" data-mode="infinite">INFINITE</button>
      <button class="mode-tab" data-mode="manual">EDIT</button>
    </div>

    <!-- Infinite mode -->
    <div id="infinite-ui">
      <div id="infinite-controls">
        <button id="start-btn">PLAY</button>
        <button id="next-btn" tabindex="-1" aria-hidden="true" title="Move on to the next section">NEXT</button>
      </div>
      <div id="info"></div>
      <div id="state-line"></div>
    </div>

    <!-- Manual mode -->
    <div id="manual-ui">
      <button id="panel-hide-btn" aria-expanded="true" aria-controls="manual-ui-body">
        <span class="lbl-hide">HIDE</span><span class="lbl-show">SHOW</span>
      </button>

      <div id="manual-ui-body">
      <div id="manual-ui-scroll">
      <!-- Genre presets -->
      <div class="collapsible-section collapsed" id="section-genre">
        <div class="section-header">
          <span class="section-label">GENRE</span>
          <div class="section-header-right">
            <button class="header-btn" id="genre-random-btn">RANDOM</button>
            <span class="section-chevron"></span>
          </div>
          <span class="section-summary" id="genre-summary"></span>
        </div>
        <div class="section-body"><div class="section-inner">
          <div class="ctrl-row" style="margin-bottom:12px">
            <div id="genre-btns" class="genre-groups"></div>
          </div>
        </div></div>
      </div>

      <!-- Feel: key, scale, BPM, sliders -->
      <div class="collapsible-section collapsed" id="section-feel">
        <div class="section-header">
          <span class="section-label">FEEL</span>
          <div class="section-header-right">
            <button class="header-btn" id="feel-random-btn">RANDOM</button>
            <span class="section-chevron"></span>
          </div>
          <span class="section-summary" id="feel-summary"></span>
        </div>
        <div class="section-body"><div class="section-inner">
          <div class="ctrl-row">
            <span class="ctrl-label">ROOT</span>
            <select id="manual-root" class="ctrl-select"></select>
            <span class="ctrl-label" style="min-width:auto;padding:0 4px">SCALE</span>
            <select id="manual-scale" class="ctrl-select"></select>
          </div>
          <div class="ctrl-row">
            <span class="ctrl-label">BPM</span>
            <input id="manual-bpm-slider" type="range" min="40" max="180" step="1" value="90">
            <span id="manual-bpm-value" class="ctrl-value">90</span>
          </div>
          <div class="ctrl-row">
            <span class="ctrl-label">OCTAVE</span>
            <input type="range" class="feel-slider" id="manual-octave-slider" min="-1" max="1" step="1" value="0">
            <span class="ctrl-value" id="manual-octave-val">0</span>
          </div>
          <div class="ctrl-row">
            <span class="ctrl-label">DENSITY</span>
            <input type="range" class="feel-slider" id="density-slider" min="0" max="1" step="0.01" value="0.60">
            <span class="ctrl-value" id="density-val">0.60</span>
          </div>
          <div class="ctrl-row">
            <span class="ctrl-label">TONE</span>
            <input type="range" class="feel-slider" id="bright-slider" min="0" max="1" step="0.01" value="0.50">
            <span class="ctrl-value" id="bright-val">0.50</span>
          </div>
          <div class="ctrl-row">
            <span class="ctrl-label">SPACE</span>
            <input type="range" class="feel-slider" id="space-slider" min="0" max="1" step="0.01" value="0.50">
            <span class="ctrl-value" id="space-val">0.50</span>
          </div>
          <div class="ctrl-row">
            <span class="ctrl-label">ROOM</span>
            <select id="manual-room" class="ctrl-select"></select>
          </div>
          <div class="ctrl-row">
            <span class="ctrl-label">HARMONY</span>
            <input type="range" class="feel-slider" id="harmony-slider" min="0" max="1" step="0.01" value="0.78">
            <span class="ctrl-value" id="harmony-val">0.78</span>
          </div>
          <div class="ctrl-row">
            <span class="ctrl-label">CHORD</span>
            <input type="range" class="feel-slider" id="chord-slider" min="2" max="8" step="1" value="4">
            <span class="ctrl-value" id="chord-val">4</span>
          </div>
          <div class="ctrl-row" title="Sidechain: everything but the drums ducks on every beat, the breathing of house and EDM">
            <span class="ctrl-label">PUMP</span>
            <input type="range" class="feel-slider" id="pump-slider" min="0" max="1" step="0.01" value="0">
            <span class="ctrl-value" id="pump-val">0.00</span>
          </div>
          <div class="ctrl-row" style="margin-bottom:4px" title="Filter sweep: everything but the drums closes down and opens back up over sixteen bars, the French house filter">
            <span class="ctrl-label">SWEEP</span>
            <input type="range" class="feel-slider" id="sweep-slider" min="0" max="1" step="0.01" value="0">
            <span class="ctrl-value" id="sweep-val">0.00</span>
          </div>
        </div></div>
      </div>

      <!-- Instruments -->
      <div class="collapsible-section collapsed" id="section-instruments">
        <div class="section-header">
          <span class="section-label">INSTRUMENTS</span>
          <div class="section-header-right">
            <button class="header-btn" id="instruments-random-btn">RANDOM</button>
            <button class="header-btn" id="clear-instruments-btn">CLEAR</button>
            <span class="section-chevron"></span>
          </div>
          <span class="section-summary" id="instruments-summary"></span>
        </div>
        <div class="section-body"><div class="section-inner">
          <div id="voice-groups"></div>
        </div></div>
      </div>

      <button class="action-btn" id="randomize-all-btn">RANDOMIZE ALL</button>

      <div class="ctrl-row">
        <span class="ctrl-label">LENGTH</span>
        <input type="range" class="feel-slider" id="manual-length" min="5" max="300" step="5" value="10">
        <span class="ctrl-value" id="manual-length-value">10s</span>
      </div>

      <div id="manual-actions">
        <button class="action-btn" id="manual-play-btn" disabled>PLAY</button>
        <button class="action-btn" id="manual-export-btn" disabled>EXPORT</button>
        <button class="action-btn" id="manual-share-btn">SHARE</button>
      </div>
      <div id="export-progress-wrap"><div id="export-progress-bar"></div></div>
      <div id="manual-status"></div>
      </div>
      </div>
    </div>

  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
