<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Orrery — Generative Music</title>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.183.2/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.2/examples/jsm/"
    }
  }
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html {
      overflow: hidden;
    }
    body {
      background: #0a0a0f;
      color: #ccc;
      font-family: 'Courier New', monospace;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    #three-container {
      position: fixed;
      top: 0; left: 0;
      z-index: 0;
    }
    #three-container canvas { display: block; }

    /* ─── Root UI wrapper ──────────────────────────────────────────────────── */
    #ui {
      position: relative;
      z-index: 1;
      text-align: center;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    /* ─── Mode tabs ───────────────────────────────────────────────────────── */
    #mode-tabs {
      pointer-events: all;
      display: flex;
      border: 1px solid #4a5a6a;
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
    }
    .mode-tab {
      background: transparent;
      border: none;
      border-right: 1px solid #4a5a6a;
      color: #7a8a9a;
      font-family: inherit;
      font-size: 11px;
      padding: 8px 22px;
      cursor: pointer;
      letter-spacing: 3px;
      text-transform: uppercase;
      transition: color 0.2s, background 0.2s;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .mode-tab:last-child { border-right: none; }
    .mode-tab:hover { color: #aabece; }
    .mode-tab.active { color: #d0dde8; background: rgba(100,140,200,0.12); }

    /* ─── Infinite mode UI ────────────────────────────────────────────────── */
    #infinite-ui {
      position: fixed;
      bottom: 36px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      white-space: nowrap;
    }
    #start-btn {
      pointer-events: all;
      background: rgba(8, 8, 14, 0.5);
      border: 1px solid #555;
      color: #999;
      font-family: inherit;
      font-size: clamp(18px, 5vw, 28px);
      padding: clamp(16px, 4vw, 22px) clamp(40px, 10vw, 72px);
      margin-bottom: 12px;
      cursor: pointer;
      letter-spacing: 4px;
      text-transform: uppercase;
      transition: all 0.3s;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    #start-btn:hover           { border-color: #aaa; color: #eee; }
    #start-btn:active          { border-color: #ccc; color: #fff; }
    #start-btn.playing         { border-color: #556; color: #778; }
    #start-btn.playing:hover   { border-color: #99aacc; color: #bbccdd; }
    #info {
      font-size: 16px;
      letter-spacing: 2px;
      color: #778899;
      line-height: 1.8;
      transition: color 1s;
      text-shadow: 0 1px 4px #000, 0 0 18px rgba(100,140,200,0.6);
    }
    #info.active { color: #ccd8e8; }
    #state-line {
      font-size: 14px;
      color: #556677;
      letter-spacing: 2px;
      transition: color 2s;
      text-shadow: 0 1px 4px #000, 0 0 14px rgba(100,140,200,0.5);
      white-space: pre-line;
      line-height: 1.8;
    }
    #state-line.active { color: #99b0c8; }

    /* ─── Collapsible sections ──────────────────────────────────────────────── */
    .collapsible-section {
      border-top: 1px solid #2a3a4a;
      padding-top: 10px;
    }
    .collapsible-section:first-child { border-top: none; padding-top: 0; }
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      padding: 4px 6px;
      margin: 0 -6px 6px;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      transition: background 0.15s;
      border-radius: 2px;
    }
    .section-header:hover { background: rgba(100,150,200,0.07); }
    .section-header:hover .section-label { color: #aabece; }
    .section-header:hover .section-chevron { color: #7a9fc0; border-color: #4a6a8a; }
    .section-header .section-label { margin-bottom: 0; }
    .section-header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .section-chevron {
      font-size: 10px;
      color: #4a6a80;
      border: 1px solid #2a3a4a;
      padding: 1px 7px;
      letter-spacing: 1px;
      transition: color 0.15s, border-color 0.15s;
      flex-shrink: 0;
    }
    .section-chevron::before { content: '–'; }
    .collapsible-section.collapsed .section-chevron::before { content: '+'; }
    .section-body {
      overflow: hidden;
      max-height: 1000px;
      opacity: 1;
      transition: max-height 0.3s ease, opacity 0.2s;
    }
    .collapsible-section.collapsed .section-body {
      max-height: 0;
      opacity: 0;
    }

    /* ─── Section label row (with inline clear button) ─────────────────────── */
    .clear-btn {
      background: transparent;
      border: 1px solid #3a4a5a;
      color: #6a7a8a;
      font-family: inherit;
      font-size: 9px;
      padding: 4px 10px;
      cursor: pointer;
      letter-spacing: 2px;
      text-transform: uppercase;
      transition: border-color 0.15s, color 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .clear-btn:hover { border-color: #6a8aaa; color: #aabece; }

    /* ─── Manual panel ────────────────────────────────────────────────────── */
    #manual-ui {
      --pad: clamp(14px, 3.5vw, 26px);
      pointer-events: none;
      display: flex;
      flex-direction: column;
      width: min(500px, 92vw);
      max-width: 100vw;
      max-height: 72vh;
      overflow: hidden;
      background: rgba(4, 5, 10, 0.8);
      border: 1px solid #4a5a6a;
      position: fixed;
      top: 50%;
      left: 50%;
      visibility: hidden;
      opacity: 0;
      transform: translate(-50%, calc(-50% - 16px)) scale(0.97);
      transform-origin: top center;
      transition: opacity 0.3s ease, transform 0.3s ease, visibility 0s linear 0.3s, background-color 0.3s ease, border-color 0.3s ease;
    }
    #manual-ui.active {
      visibility: visible;
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
      pointer-events: all;
      transition: opacity 0.3s ease, transform 0.3s ease, visibility 0s linear 0s, background-color 0.3s ease, border-color 0.3s ease;
    }
    /* ─── Short-viewport overrides (landscape phones) ───────────────────────
       #manual-ui is normally centered via translate(-50%, -50%). Centering
       a height-capped box wastes a symmetric margin top *and* bottom — on a
       tall portrait screen that's a trivial amount, but on a short landscape
       phone (~350-430px tall) it eats a third or more of the viewport as
       blank space before any content even starts, leaving almost nothing
       visible without scrolling.
       Fix: stop centering vertically here. Anchor the panel's top edge just
       below the fixed #mode-tabs (~60px tall + clearance ≈ 76px) and let it
       run down to near the bottom edge instead, reclaiming that space for
       content. top:50% is left untouched (only transform's Y changes) so
       this still composes with the existing opacity/transform transition —
       see the translate(-50%, calc(76px - 50vh)) trick below: top:50% puts
       the box's reference point at 50vh, and this translateY cancels that
       back down to a flat 76px from the real viewport top, regardless of
       viewport height.
       This block must stay positioned between the unconditional .active and
       .collapsed rules below: its #manual-ui.active selector ties in
       specificity with both of them, so when collapsed+active are both set
       (the collapsed/pill state), source order is the tiebreaker — placing
       it here means the later .collapsed rule still wins and slides the
       pill down, while it still wins over the earlier plain .active rule
       when only .active is set (the normal open state). Moving this block
       elsewhere will silently break one of those two cases. */
    @media (max-height: 480px) {
      #manual-ui {
        max-height: calc(100dvh - 92px);
        transform: translate(-50%, calc(76px - 50vh - 16px)) scale(0.97);
      }
      #manual-ui.active {
        transform: translate(-50%, calc(76px - 50vh)) scale(1);
      }
    }
    /* Collapsed: shrink to a pill around the hide/show button and slide it
       down to rest above the bottom edge of the viewport. The panel's own
       width/height never change here -- only its background/border fade
       out and the HIDE button shrinks to a pill via its own width/margin.
       Keeping #manual-ui's box size constant means the "-50%, -50%" centering
       transform always resolves to the same value, so the extra vertical
       offset added here can be a plain constant (no `%` of a box whose size
       is also changing) -- that's what was desyncing the slide on mobile. */
    #manual-ui.collapsed {
      pointer-events: none;
      background: transparent;
      border-color: transparent;
      transform: translate(-50%, calc(50vh - 84px)) scale(1);
    }
    #manual-ui.collapsed #panel-hide-btn {
      pointer-events: all;
      width: 140px;
      margin: 0 auto;
      font-size: 13px;
      padding: 16px 0;
      border: 1px solid #4a5a6a;
      background: rgba(6, 8, 15, 0.92);
    }
    /* Scrollable body lives below the (non-scrolling) HIDE button so the
       button stays flush at the panel's top edge with nothing behind it. */
    #manual-ui-scroll {
      flex: 1;
      min-height: 0;
      max-height: 70vh;
      overflow-x: hidden;
      overflow-y: auto;
      padding: var(--pad);
      padding-top: 8px;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
      scrollbar-color: #3a4a5a transparent;
      scrollbar-gutter: stable both-edges;
      opacity: 1;
      transition: opacity 0.2s ease;
    }
    #manual-ui-scroll::-webkit-scrollbar { width: 3px; }
    #manual-ui-scroll::-webkit-scrollbar-thumb { background: #3a4a5a; }

    /* Stays the same size (so #manual-ui's height doesn't change) but
       fades out and stops receiving input. */
    #manual-ui.collapsed #manual-ui-scroll {
      opacity: 0;
      pointer-events: none;
    }

    /* control rows */
    .ctrl-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }
    .ctrl-label {
      font-size: 10px;
      letter-spacing: 3px;
      color: #8899aa;
      min-width: 58px;
      text-align: right;
      flex-shrink: 0;
    }
    .ctrl-unit {
      font-size: 10px;
      letter-spacing: 3px;
      color: #8899aa;
      flex-shrink: 0;
    }
    .ctrl-value {
      font-size: 12px;
      color: #aabece;
      min-width: 3ch;
    }

    /* ─── BPM slider ─────────────────────────────────────────────────────────── */
    #manual-bpm-slider {
      -webkit-appearance: none;
      appearance: none;
      flex: 1;
      height: 40px;
      background: transparent;
      outline: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    #manual-bpm-slider::-webkit-slider-runnable-track {
      height: 4px;
      border-radius: 2px;
      background: #4a6a80;
    }
    #manual-bpm-slider::-moz-range-track {
      height: 4px;
      border-radius: 2px;
      background: #4a6a80;
    }
    #manual-bpm-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: clamp(26px, 6vw, 34px);
      height: clamp(26px, 6vw, 34px);
      border-radius: 50%;
      background: #8aafc8;
      cursor: pointer;
      margin-top: -13px;
    }
    #manual-bpm-slider::-moz-range-thumb {
      width: clamp(26px, 6vw, 34px);
      height: clamp(26px, 6vw, 34px);
      border-radius: 50%;
      background: #8aafc8;
      cursor: pointer;
      border: none;
    }


    /* instruments */
    .section-label {
      font-size: 9px;
      letter-spacing: 4px;
      color: #6a7a8a;
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    #voice-groups {
      margin-bottom: 22px;
    }

    /* bass / drums subtype rows */
    .voice-group {
      display: flex;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 10px;
    }
    .group-label {
      font-size: 9px;
      letter-spacing: 3px;
      color: #6a7a8a;
      text-transform: uppercase;
      min-width: 46px;
      text-align: right;
      flex-shrink: 0;
    }
    .subtype-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 14px;
    }

    /* divider between groups and grid */
    .voices-divider {
      border-top: 1px solid #2a3040;
      margin: 12px 0;
    }

    /* simple voices grid */
    .inst-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px 6px;
    }

    /* shared toggle style */
    .inst-toggle {
      display: flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .inst-toggle input[type="checkbox"] {
      -webkit-appearance: none;
      appearance: none;
      width: 13px;
      height: 13px;
      border: 1px solid #5a6a7a;
      background: transparent;
      cursor: pointer;
      flex-shrink: 0;
      position: relative;
    }
    .inst-toggle input[type="checkbox"]:checked {
      background: #7a9fc0;
      border-color: #7a9fc0;
    }
    .inst-toggle input[type="checkbox"]:checked::after {
      content: '';
      position: absolute;
      left: 2px;
      top: -1px;
      width: 5px;
      height: 8px;
      border: 2px solid #0a0a0f;
      border-top: none;
      border-left: none;
      transform: rotate(45deg);
    }
    .inst-name {
      font-size: 9px;
      letter-spacing: 2px;
      color: #7a8a9a;
      text-transform: uppercase;
    }
    .inst-toggle input:checked ~ .inst-name { color: #aabece; }

    /* action buttons */
    #manual-actions {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
    }
    .action-btn {
      flex: 1;
      background: transparent;
      border: 1px solid #4a5a6a;
      color: #8899aa;
      font-family: inherit;
      font-size: 11px;
      padding: 11px 8px;
      cursor: pointer;
      letter-spacing: 3px;
      text-transform: uppercase;
      transition: border-color 0.2s, color 0.2s;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .action-btn:hover:not(:disabled) { border-color: #8899aa; color: #d0dde8; }
    .action-btn.playing { border-color: #7a8fa8; color: #aabbc8; }
    .action-btn.recording { border-color: #8a6a6a; color: #c8a8a8; cursor: default; }
    .action-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* genre preset buttons */
    .genre-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      flex: 1;
    }
    .genre-btn {
      background: transparent;
      border: 1px solid #3a4a5a;
      color: #6a7a8a;
      font-family: inherit;
      font-size: 9px;
      padding: 5px 11px;
      cursor: pointer;
      letter-spacing: 2px;
      text-transform: uppercase;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .genre-btn:hover { border-color: #6a8aaa; color: #aabece; }
    .genre-btn.active { border-color: #7a9fc0; color: #ccdde8; background: rgba(100,150,200,0.1); }

    /* root / scale dropdowns */
    .ctrl-select {
      background: rgba(255,255,255,0.04);
      border: 1px solid #4a5a6a;
      color: #aabece;
      font-family: inherit;
      font-size: 10px;
      letter-spacing: 1px;
      padding: 5px 6px;
      outline: none;
      cursor: pointer;
    }
    .ctrl-select option { background: #0a0a18; color: #aabece; }
    #manual-root  { width: 56px; }
    #manual-scale { flex: 1; }
    #manual-room  { flex: 1; }

    /* ─── Feel sliders (density / tone / space / length) ────────────────────── */
    .feel-slider {
      -webkit-appearance: none;
      appearance: none;
      flex: 1;
      height: 32px;
      background: transparent;
      outline: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .feel-slider::-webkit-slider-runnable-track {
      height: 4px;
      border-radius: 2px;
      background: #4a6a80;
    }
    .feel-slider::-moz-range-track {
      height: 4px;
      border-radius: 2px;
      background: #4a6a80;
    }
    .feel-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #8aafc8;
      cursor: pointer;
      margin-top: -9px;
    }
    .feel-slider::-moz-range-thumb {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #8aafc8;
      cursor: pointer;
      border: none;
    }

    /* ─── Export progress ─────────────────────────────────────────────────────── */
    #export-progress-wrap {
      height: 2px;
      background: rgba(100,140,200,0.08);
      margin: 6px 0 12px;
      overflow: hidden;
      opacity: 0;
      transition: opacity 0.4s;
    }
    #export-progress-wrap.active { opacity: 1; }
    #export-progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #3a5a78, #8aafc8);
      transition: width 0.7s linear;
    }

    #manual-status {
      font-size: 10px;
      letter-spacing: 2px;
      color: #5a6a7a;
      text-align: center;
      min-height: 14px;
      transition: color 0.5s;
    }
    #manual-status.active { color: #aabece; }

    /* ─── Mobile overrides ──────────────────────────────────────────────────── */
    @media (max-width: 600px) {
      #manual-ui {
        width: calc(100vw - 20px);
        /* #manual-ui is centered on the viewport via fixed positioning +
           translate(-50%, -50%): when its content overflows and gets
           clipped to max-height, its centered top edge sits at
           (100dvh − max-height) / 2. Subtracting 150px here keeps that
           edge ≥ ~75px from the viewport top — clear of the fixed
           #mode-tabs (~60px tall) with room to spare. */
        max-height: calc(100dvh - 150px);
        --pad: 16px;
      }

      #manual-ui-scroll {
        padding-left: 14px;
        padding-right: 14px;
      }

      /* bigger mode tab tap targets */
      .mode-tab {
        font-size: 12px;
        padding: 12px 18px;
        letter-spacing: 2px;
      }

      /* sliders need more room to breathe so thumbs don't overlap */
      .ctrl-row {
        gap: 10px;
        margin-bottom: 22px;
      }

      /* readable labels */
      .ctrl-label  { font-size: 11px; letter-spacing: 1.5px; min-width: 50px; }
      .section-label { font-size: 11px; letter-spacing: 2px; }
      .group-label { font-size: 11px; letter-spacing: 2px; }
      .ctrl-unit   { font-size: 11px; }
      .ctrl-value  { font-size: 13px; min-width: 3.5ch; text-align: right; }

      /* bigger slider thumbs — easier to grab with a thumb (the finger kind) */
      .feel-slider::-webkit-slider-thumb {
        width: 30px;
        height: 30px;
        margin-top: -13px;
      }
      .feel-slider::-moz-range-thumb {
        width: 30px;
        height: 30px;
      }
      #manual-bpm-slider::-webkit-slider-thumb,
      #manual-bpm-slider::-moz-range-thumb {
        width: 32px;
        height: 32px;
      }
      #manual-bpm-slider::-webkit-slider-thumb { margin-top: -14px; }

      /* section headers: bigger tap target */
      .section-header { padding: 8px 6px; margin-bottom: 8px; }
      .section-chevron { font-size: 12px; padding: 2px 9px; }

      /* genre buttons: bigger tap area + font */
      .genre-btn {
        font-size: 11px;
        padding: 9px 14px;
        letter-spacing: 1.5px;
      }

      /* clear button: bigger tap area */
      .clear-btn {
        font-size: 11px;
        padding: 8px 14px;
        letter-spacing: 1.5px;
      }

      /* action buttons */
      .action-btn {
        font-size: 13px;
        padding: 14px 8px;
      }

      /* instrument grid: 2 columns so labels aren't cramped */
      .inst-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 6px 8px;
      }

      /* checkboxes: larger visual + extended tap target via padding */
      .inst-toggle {
        padding: 7px 4px;
        gap: 10px;
      }
      .inst-toggle input[type="checkbox"] {
        width: 18px;
        height: 18px;
        flex-shrink: 0;
      }
      .inst-toggle input[type="checkbox"]:checked::after {
        left: 3px;
        top: 0px;
        width: 7px;
        height: 11px;
      }
      .inst-name {
        font-size: 11px;
        letter-spacing: 1.5px;
      }
    }

    #panel-hide-btn {
      display: block;
      flex-shrink: 0;
      width: 100%;
      background: rgba(6, 8, 15, 0.92);
      border: none;
      border-bottom: 1px solid #2a3540;
      color: #4a5a6a;
      font-family: inherit;
      font-size: 9px;
      padding: clamp(12px, calc(var(--pad) - 8px), 18px) 0 12px;
      cursor: pointer;
      letter-spacing: 3px;
      text-transform: uppercase;
      text-align: center;
      transition: color 0.15s, border-color 0.3s ease, background-color 0.3s ease, width 0.3s ease, margin 0.3s ease, font-size 0.3s ease, padding 0.3s ease;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    #panel-hide-btn:hover { color: #aabece; }

    #panel-toggle {
      display: none;
      position: fixed;
      bottom: 36px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(8, 8, 14, 0.5);
      border: 1px solid #4a5a6a;
      color: #7a8a9a;
      font-family: inherit;
      font-size: clamp(14px, 4vw, 18px);
      padding: clamp(10px, 3vw, 14px) clamp(28px, 8vw, 52px);
      cursor: pointer;
      letter-spacing: 4px;
      text-transform: uppercase;
      transition: border-color 0.2s, color 0.2s, opacity 0.15s;
      z-index: 2;
      pointer-events: all;
      white-space: nowrap;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    #panel-toggle:hover { border-color: #aabece; color: #d0dde8; }
    #panel-toggle:active { opacity: 0.4; }
  </style>
</head>
<body>
  <div id="three-container"></div>
  <div id="ui">

    <!-- Mode tabs -->
    <div id="mode-tabs">
      <button class="mode-tab active" data-mode="infinite">INFINITE</button>
      <button class="mode-tab" data-mode="manual">EDIT</button>
    </div>
    <button id="panel-toggle">SHOW</button>

    <!-- Infinite mode -->
    <div id="infinite-ui">
      <button id="start-btn">PLAY</button>
      <div id="info"></div>
      <div id="state-line"></div>
    </div>

    <!-- Manual mode -->
    <div id="manual-ui">
      <button id="panel-hide-btn">HIDE</button>

      <div id="manual-ui-scroll">
      <!-- Genre presets -->
      <div class="collapsible-section collapsed" id="section-genre">
        <div class="section-header">
          <span class="section-label">GENRE</span>
          <div class="section-header-right">
            <button class="clear-btn" id="genre-random-btn">RANDOM</button>
            <span class="section-chevron"></span>
          </div>
        </div>
        <div class="section-body">
          <div class="ctrl-row" style="margin-bottom:12px">
            <div id="genre-btns" class="genre-row"></div>
          </div>
        </div>
      </div>

      <!-- Feel: key, scale, BPM, sliders -->
      <div class="collapsible-section collapsed" id="section-feel">
        <div class="section-header">
          <span class="section-label">FEEL</span>
          <span class="section-chevron"></span>
        </div>
        <div class="section-body">
          <div class="ctrl-row">
            <span class="ctrl-label">ROOT</span>
            <select id="manual-root" class="ctrl-select"></select>
            <span class="ctrl-label" style="min-width:auto;padding:0 4px">SCALE</span>
            <select id="manual-scale" class="ctrl-select"></select>
          </div>
          <div class="ctrl-row">
            <span class="ctrl-label">BPM</span>
            <input id="manual-bpm-slider" type="range" min="40" max="160" step="1" value="90">
            <span id="manual-bpm-value" class="ctrl-value">90</span>
          </div>
          <div class="ctrl-row">
            <span class="ctrl-label">OCTAVE</span>
            <input type="range" class="feel-slider" id="manual-octave-slider" min="-3" max="1" step="1" value="0">
            <span class="ctrl-value" id="manual-octave-val">0</span>
          </div>
          <div class="ctrl-row">
            <span class="ctrl-label">DENSITY</span>
            <input type="range" class="feel-slider" id="density-slider" min="0" max="1" step="0.01" value="0.60">
            <span class="ctrl-value" id="density-val">0.60</span>
          </div>
          <div class="ctrl-row">
            <span class="ctrl-label">TONE</span>
            <input type="range" class="feel-slider" id="bright-slider" min="0" max="1" step="0.01" value="0.50">
            <span class="ctrl-value" id="bright-val">0.50</span>
          </div>
          <div class="ctrl-row">
            <span class="ctrl-label">SPACE</span>
            <input type="range" class="feel-slider" id="space-slider" min="0" max="1" step="0.01" value="0.50">
            <span class="ctrl-value" id="space-val">0.50</span>
          </div>
          <div class="ctrl-row">
            <span class="ctrl-label">ROOM</span>
            <select id="manual-room" class="ctrl-select"></select>
          </div>
          <div class="ctrl-row">
            <span class="ctrl-label">HARMONY</span>
            <input type="range" class="feel-slider" id="harmony-slider" min="0" max="1" step="0.01" value="0.78">
            <span class="ctrl-value" id="harmony-val">0.78</span>
          </div>
          <div class="ctrl-row" style="margin-bottom:4px">
            <span class="ctrl-label">CHORD</span>
            <input type="range" class="feel-slider" id="chord-slider" min="2" max="8" step="1" value="4">
            <span class="ctrl-value" id="chord-val">4</span>
          </div>
        </div>
      </div>

      <!-- Instruments -->
      <div class="collapsible-section collapsed" id="section-instruments">
        <div class="section-header">
          <span class="section-label">INSTRUMENTS</span>
          <div class="section-header-right">
            <button class="clear-btn" id="clear-instruments-btn">CLEAR</button>
            <span class="section-chevron"></span>
          </div>
        </div>
        <div class="section-body">
          <div id="voice-groups"></div>
        </div>
      </div>

      <div class="ctrl-row" style="margin-top:14px">
        <span class="ctrl-label">LENGTH</span>
        <input type="range" class="feel-slider" id="manual-length" min="5" max="300" step="5" value="10">
        <span class="ctrl-value" id="manual-length-value">10s</span>
      </div>

      <div id="manual-actions">
        <button class="action-btn" id="manual-play-btn" disabled>PLAY</button>
        <button class="action-btn" id="manual-export-btn" disabled>EXPORT</button>
        <button class="action-btn" id="manual-share-btn">SHARE</button>
      </div>
      <div id="export-progress-wrap"><div id="export-progress-bar"></div></div>
      <div id="manual-status"></div>
      </div>
    </div>

  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
